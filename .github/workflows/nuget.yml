name: NuGet

# The library's package (src/Sallyport → nuget.org/packages/Sallyport), apart from the Windows app's release
# (release.yml): its own version in src/Sallyport/Sallyport.csproj, its own changelog (src/Sallyport/CHANGELOG.md), its
# own tag (nuget-v<version>) and never a GitHub release — every installed copy of the app updates from the latest
# release, so a release of the package's would be offered to it (docs/DECISIONS.md D34, D36). Started by hand, like
# release.yml; a rehearsal (`dry_run`, the default) tests and packs, keeps the package as the run's artifact, and
# touches neither nuget.org nor git. Publishing signs in by NuGet's Trusted Publishing (OIDC): no API key is stored
# anywhere, and the policy on nuget.org names this file.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0); empty to keep or bump the one in src/Sallyport/Sallyport.csproj'
        required: false
        type: string
        default: ''
      bump:
        description: 'Bump when no version is given (none publishes the number already there)'
        required: false
        type: choice
        default: none
        options: [none, patch, minor, major]
      dry_run:
        description: 'DRY RUN: test and pack only; no push, commit or tag'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nuget
  cancel-in-progress: false

jobs:
  # The library claims to be no more Windows' than .NET is, so its tests run on Linux as well.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/Sallyport.Tests -c Release --nologo

  pack:
    name: Pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0   # the tag check below reads every tag
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with:
          dotnet-version: '10.0.x'

      # The working tree only: the project's <Version> and the changelog's section, dated. Committed by the publish job,
      # and only once the package is on nuget.org. The inputs reach the script as environment, never pasted into it.
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          ./apps/Sallyport.Setup/version.ps1 -Version $env:VERSION -Bump $env:BUMP -Date $date `
            -VersionFile src/Sallyport/Sallyport.csproj -ChangelogFile src/Sallyport/CHANGELOG.md -TagPrefix nuget-v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "date=$date"

      # nuget.org never takes a version twice, so a tag already standing on another commit means that version is
      # published from other source: refused here, before anything is built.
      - name: Check the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$env:TAG" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $tagged = git rev-list -n 1 $env:TAG
            if ($tagged -ne (git rev-parse HEAD)) { throw "$env:TAG is on $tagged, not on this commit: give the package a new version." }
            "$env:TAG already stands on this commit: a re-run."
          }
          exit 0

      - name: Pack
        run: dotnet pack src/Sallyport -c Release --nologo -o artifacts/nuget

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: sallyport-nuget-${{ steps.version.outputs.version }}
          path: artifacts/nuget/*
          if-no-files-found: error

      - name: Rehearsal summary
        if: ${{ inputs.dry_run }}
        run: |
          "DRY RUN: nothing pushed, committed or tagged."
          "Package that would publish: Sallyport ${{ steps.version.outputs.version }}"
          Get-ChildItem artifacts/nuget | Format-Table Name, Length -AutoSize

  publish:
    name: Publish
    needs: [test, pack]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the version commit and the tag
      id-token: write   # Trusted Publishing: nuget.org exchanges this run's OIDC token for a short-lived key
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: sallyport-nuget-${{ needs.pack.outputs.version }}
          path: artifacts/nuget

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1
        with:
          user: Jiarong.Gu

      # The one step that cannot be undone; everything after it can be re-run. --skip-duplicate lets a re-run pass a
      # version already live, and the .snupkg beside the .nupkg goes with it.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The same two files the pack job wrote, written again from its version and date, and only those committed. A newer
      # main (the app's release commits its version too) is merged, never rebased onto, so the tag stays on the source
      # that was packed.
      - name: Commit the version
        env:
          VERSION: ${{ needs.pack.outputs.version }}
          DATE: ${{ needs.pack.outputs.date }}
        run: |
          ./apps/Sallyport.Setup/version.ps1 -Version $env:VERSION -Date $env:DATE `
            -VersionFile src/Sallyport/Sallyport.csproj -ChangelogFile src/Sallyport/CHANGELOG.md -TagPrefix nuget-v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git add src/Sallyport/Sallyport.csproj src/Sallyport/CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "Nothing to commit: the version was already written."; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: package ${{ needs.pack.outputs.tag }}"
          $version = git rev-parse HEAD
          for ($try = 1; $try -le 3; $try++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 3) { throw "main would not take the version commit after 3 tries." }
            git fetch origin main
            git merge --no-edit origin/main
            if ($LASTEXITCODE) { throw "main moved, and its changes do not merge with the version commit: finish this package by hand." }
          }
          git checkout -q $version

      - name: Tag
        env:
          TAG: ${{ needs.pack.outputs.tag }}
        run: |
          git rev-parse -q --verify "refs/tags/$env:TAG" | Out-Null
          if ($LASTEXITCODE -eq 0) { "$env:TAG already exists: a re-run, left where it is."; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a $env:TAG -m "Sallyport package $env:TAG"
          git push origin $env:TAG
